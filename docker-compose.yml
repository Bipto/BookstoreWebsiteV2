services:

  # ==========================================================
  # Apache
  # ==========================================================

  apache:
    build:
      context: ./apache
    container_name: multidomain-apache

    ports:
      - "80:80"

    volumes:
      - ./src/sites/main/php:/var/www/sites/main:ro
      - ./src/sites/admin/php:/var/www/sites/admin:ro
      - ./src/sites/assets/php:/var/www/sites/assets:ro
      - ./src/api/php:/var/www/api:ro
      - ./src/shared/php:/var/www/shared:ro

    depends_on:
      - php-main
      - php-admin
      - php-api
      - php-assets

    networks:
      - web

  # ==========================================================
  # Main localhost site
  # ==========================================================

  php-main:
    build:
      context: ./php
    container_name: multidomain-php-main

    env_file:
      - ./.env

    volumes:
      - ./src/sites/main/php:/var/www/sites/main:ro
      - ./src/shared/php:/var/www/shared:ro
      - ./composer.json:/var/www/composer.json:ro
      - ./src/sites/main/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    cpus: "0.50"
    mem_limit: 512m

    networks:
      - web

  # ==========================================================
  # admin.localhost
  # ==========================================================

  php-admin:
    build:
      context: ./php
    container_name: multidomain-php-admin

    env_file:
      - ./.env

    volumes:
      - ./src/sites/admin/php:/var/www/sites/admin:ro
      - ./src/shared/php:/var/www/shared:ro
      - ./composer.json:/var/www/composer.json:ro
      - ./src/sites/admin/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    cpus: "0.50"
    mem_limit: 512m

    networks:
      - web

  # ==========================================================
  # api.localhost
  # ==========================================================

  php-api:
    build:
      context: ./php
    container_name: multidomain-php-api

    env_file:
      - ./.env

    volumes:
      - ./src/api/php:/var/www/api:ro
      - ./src/shared/php:/var/www/shared:ro
      - ./composer.json:/var/www/composer.json:ro
      - ./src/api/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    cpus: "0.50"
    mem_limit: 512m

    networks:
      - web

  # ==========================================================
  # assets.localhost
  # ==========================================================

  php-assets:
    build:
      context: ./php
    container_name: multidomain-php-assets

    env_file:
      - ./.env

    volumes:
      - ./src/sites/assets/php:/var/www/sites/assets:ro
      - ./src/shared/php:/var/www/shared:ro
      - ./composer.json:/var/www/composer.json:ro
      - ./src/sites/assets/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    cpus: "0.50"
    mem_limit: 512m

    networks:
      - web

  # ==========================================================
  # Sass compiler
  # ==========================================================

  sass:
    image: node:24-alpine
    container_name: multidomain-sass

    working_dir: /app

    volumes:
      - ./src/sites/main/scss:/app/src/sites/main/scss:ro
      - ./src/sites/admin/scss:/app/src/sites/admin/scss:ro
      - ./src/shared/scss:/app/src/shared/scss:ro

      - ./package.json:/app/package.json:ro

      # CSS output directories
      - ./src/sites/main/php/public/css:/app/src/sites/main/php/public/css
      - ./src/sites/admin/php/public/css:/app/src/sites/admin/php/public/css

    command: sh -c "npm install && npm run watch"

    networks:
      - web

  # ==========================================================
  # Postgres
  # ==========================================================

  postgres:
    image: postgres:17
    container_name: bookstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web

# ==========================================================
# Named volumes
# ==========================================================

volumes:
  postgres_data:

    # ==========================================================
    # Networks
    # ==========================================================

networks:
  web:
