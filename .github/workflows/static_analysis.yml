
name: Static Analysis

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PHP test container
        run: docker compose build php-tests

      - name: Start PHP test container
        run: docker compose up -d php-tests

      - name: Validate Composer
        run: docker compose exec -T php-tests composer validate --strict

      - name: Run PHPStan
        run: docker compose exec -T php-tests composer analyse
