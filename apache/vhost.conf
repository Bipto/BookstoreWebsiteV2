# ============================================================
# localhost
# ============================================================

<VirtualHost *:80>

    ServerName localhost

    DocumentRoot "/var/www/sites/main/public"

    <Directory "/var/www/sites/main">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    DirectoryIndex index.php index.html

    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://php-main:9000"
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

</VirtualHost>


